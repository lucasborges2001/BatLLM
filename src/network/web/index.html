<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>BatLLM Online</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131c; color: #edf1fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #20283b, #10131c 55%); }
    main { width: min(960px, 100%); margin: auto; padding: 24px 16px 40px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; }
    .muted { color: #a8b2c8; font-size: .9rem; }
    .panel { background: #1a2030; border: 1px solid #30394d; border-radius: 14px; padding: 16px; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .pill { background: #252e42; border-radius: 999px; padding: 7px 11px; font-size: .85rem; }
    .arena { position: relative; aspect-ratio: 16 / 9; min-height: 260px; overflow: hidden; border: 1px solid #46516a; border-radius: 14px; background-color: #121a29; background-image: linear-gradient(#ffffff0c 1px, transparent 1px), linear-gradient(90deg, #ffffff0c 1px, transparent 1px); background-size: 8% 8%; }
    .bot { position: absolute; width: 44px; height: 44px; border: 3px solid #e8eefc; border-radius: 50%; transform: translate(-50%, -50%); transition: left .35s, top .35s, transform .35s; display: grid; place-items: center; }
    .bot-one { background: #3b82d0; }
    .bot-two { background: #9662c8; }
    .bot.shield { box-shadow: 0 0 0 7px #b49aff88; }
    .arrow { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 15px solid white; margin-left: 4px; }
    .bot-tag { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .75rem; color: white; text-shadow: 0 1px 3px #000; }
    .players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
    .player { border: 1px solid #30394d; border-radius: 12px; background: #1a2030; padding: 12px; }
    .player.active { border-color: #8db8ff; }
    .player strong { display: block; margin-bottom: 5px; }
    .health { font-size: 1.4rem; font-weight: 700; }
    .command { color: #a8b2c8; font-size: .85rem; margin-top: 5px; }
    form { margin-top: 14px; }
    textarea { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 12px; border-radius: 10px; border: 1px solid #46516a; background: #111827; color: #edf1fa; font: inherit; }
    button { margin-top: 10px; border: 0; border-radius: 9px; padding: 11px 18px; background: #3479d1; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
    #notice { min-height: 24px; margin-top: 10px; color: #c3d5f4; }
    @media (max-width: 600px) { main { padding: 16px 12px 28px; } .arena { aspect-ratio: 4 / 3; min-height: 240px; } .bot { width: 36px; height: 36px; } .players { gap: 8px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>BatLLM Online</h1>
      <div class="muted" id="identity">Conectando a la partida…</div>
    </div>
    <div class="pill" id="connection">Conectando</div>
  </header>

  <div class="summary">
    <div class="pill" id="round">Ronda —</div>
    <div class="pill" id="turn">Turno —</div>
    <div class="pill" id="model">Modelo —</div>
  </div>

  <section class="panel">
    <div class="arena" aria-label="Arena de juego">
      <div class="bot bot-one" id="bot-1"><span class="arrow"></span><span class="bot-tag"></span></div>
      <div class="bot bot-two" id="bot-2"><span class="arrow"></span><span class="bot-tag"></span></div>
    </div>
    <div class="players">
      <div class="player" id="player-1">
        <strong>Jugador 1</strong>
        <div class="health" id="health-1">— HP</div>
        <div class="command" id="command-1">Último comando: —</div>
        <div class="command" id="ready-1">Esperando prompt</div>
      </div>
      <div class="player" id="player-2">
        <strong>Jugador 2</strong>
        <div class="health" id="health-2">— HP</div>
        <div class="command" id="command-2">Último comando: —</div>
        <div class="command" id="ready-2">Esperando prompt</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <strong id="status">Esperando estado del juego…</strong>
    <form id="prompt-form">
      <label for="prompt">Instrucciones para tu bot</label>
      <textarea id="prompt" maxlength="4000" required placeholder="Ejemplo: orientate hacia el rival, mantené el escudo y dispará cuando esté desprotegido."></textarea>
      <button id="submit" type="submit">Enviar prompt</button>
    </form>
    <div id="notice" role="status"></div>
  </section>
</main>

<script>
  const token = window.location.pathname.split("/").filter(Boolean).pop();
  const byId = (id) => document.getElementById(id);
  let currentState = null;
  let loading = false;

  function renderBot(bot) {
    const node = byId("bot-" + bot.id);
    node.style.left = (bot.x * 100) + "%";
    node.style.top = ((1 - bot.y) * 100) + "%";
    node.style.transform = "translate(-50%, -50%) rotate(" + bot.rot + "deg)";
    node.classList.toggle("shield", bot.shield);
    node.querySelector(".bot-tag").style.transform =
      "translateX(-50%) rotate(" + (-bot.rot) + "deg)";
    node.querySelector(".bot-tag").textContent = "Bot " + bot.id + " · " + bot.health + " HP";
    byId("health-" + bot.id).textContent = bot.health + " HP";
    byId("command-" + bot.id).textContent = "Último comando: " + (bot.last_cmd || "—");
  }

  function render(state) {
    currentState = state;
    const me = state.players.find((player) => player.id === state.player_id);
    const opponent = state.players.find((player) => player.id !== state.player_id);
    byId("identity").textContent = "Estás jugando como Jugador " + state.player_id;
    byId("connection").textContent = "Conectado";
    byId("round").textContent = "Ronda " + state.round + " / " + state.total_rounds;
    byId("turn").textContent = state.round_active
      ? "Turno " + Math.min(state.turn + 1, state.turns_per_round) + " / " + state.turns_per_round
      : "Esperando ronda";
    byId("model").textContent = "Modelo: " + (state.model || "Ollama");
    state.bots.forEach(renderBot);

    state.players.forEach((player) => {
      byId("player-" + player.id).classList.toggle("active", player.id === state.player_id);
      byId("ready-" + player.id).textContent = player.ready ? "Prompt recibido" : "Sin prompt";
    });

    if (state.phase === "running") {
      byId("status").textContent = "Partida en curso. Los bots están ejecutando sus turnos.";
    } else if (me.ready) {
      byId("status").textContent = "Prompt recibido. Esperando al Jugador " + opponent.id + ".";
    } else if (opponent.ready) {
      byId("status").textContent = "El rival ya envió su prompt. Tu turno de preparar instrucciones.";
    } else {
      byId("status").textContent = "Esperando los prompts de ambos jugadores.";
    }

    const disabled = state.phase === "running" || me.ready;
    byId("prompt").disabled = disabled;
    byId("submit").disabled = disabled;
  }

  async function refresh() {
    if (loading) return;
    loading = true;
    try {
      const response = await fetch("/api/v1/state/" + encodeURIComponent(token), { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "No se pudo consultar la partida.");
      render(payload);
    } catch (error) {
      byId("connection").textContent = "Desconectado";
      byId("status").textContent = error.message;
    } finally {
      loading = false;
      window.setTimeout(refresh, 800);
    }
  }

  byId("prompt-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const prompt = byId("prompt").value.trim();
    if (!prompt || !currentState) return;
    byId("submit").disabled = true;
    byId("notice").textContent = "Enviando prompt…";
    try {
      const response = await fetch("/api/v1/prompts/" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "No se pudo enviar el prompt.");
      byId("prompt").value = "";
      byId("notice").textContent = payload.waiting_for_opponent
        ? "Prompt recibido. Esperando al otro jugador."
        : "Ambos prompts recibidos. Comienza la ronda.";
      await refresh();
    } catch (error) {
      byId("notice").textContent = error.message;
      await refresh();
    }
  });

  refresh();
</script>
</body>
</html>
