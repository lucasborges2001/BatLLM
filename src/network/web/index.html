<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <meta name="referrer" content="no-referrer">
  <title>BatLLM Online</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>BatLLM Online</h1>
      <div class="muted" id="identity">Connecting to the game…</div>
    </div>
    <div class="header-actions">
      <div class="languages" role="group" aria-label="Language" id="languages">
        <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 60 40"><path fill="#234273" d="M0 0h60v40H0z"/><path stroke="#fff" stroke-width="8" d="M0 0l60 40M60 0L0 40"/><path stroke="#c8102e" stroke-width="3" d="M0 0l60 40M60 0L0 40"/><path stroke="#fff" stroke-width="13" d="M30 0v40M0 20h60"/><path stroke="#c8102e" stroke-width="7" d="M30 0v40M0 20h60"/></svg> EN
        </button>
        <button type="button" data-language="es" lang="es" aria-label="Español" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 60 40"><path fill="#aa151b" d="M0 0h60v40H0z"/><path fill="#f1bf00" d="M0 10h60v20H0z"/></svg> ES
        </button>
      </div>
      <div class="pill" id="connection">Connecting</div>
      <button class="help-button" id="help-button" type="button" aria-haspopup="dialog" data-i18n="help">Help</button>
    </div>
  </header>
  <div class="summary">
    <div class="pill" id="game">Game —</div>
    <div class="pill" id="round">Round —</div>
    <div class="pill" id="turn">Turn —</div>
    <div class="pill" id="model">Model —</div>
  </div>
  <div class="layout">
    <section class="panel arena-panel">
      <div class="arena" id="arena" aria-label="Game arena">
        <div class="bot bot-one" id="bot-1"><div class="bot-body"><span class="arrow"></span></div><span class="bot-tag"></span></div>
        <div class="bot bot-two" id="bot-2"><div class="bot-body"><span class="arrow"></span></div><span class="bot-tag"></span></div>
      </div>
    </section>
    <section class="panel controls">
      <div class="players">
        <div class="player" id="player-1">
          <strong id="name-1">Player 1</strong>
          <div class="health" id="health-1">— HP</div>
          <div class="command" id="command-1">Last command: —</div>
          <div class="command" id="ready-1">No prompt</div>
          <div class="command telemetry" id="position-1">X: — · Y: —</div>
          <div class="command telemetry" id="rotation-1">Rotation: —</div>
          <div class="command" id="shield-1">Shield: —</div>
        </div>
        <div class="player" id="player-2">
          <strong id="name-2">Player 2</strong>
          <div class="health" id="health-2">— HP</div>
          <div class="command" id="command-2">Last command: —</div>
          <div class="command" id="ready-2">No prompt</div>
          <div class="command telemetry" id="position-2">X: — · Y: —</div>
          <div class="command telemetry" id="rotation-2">Rotation: —</div>
          <div class="command" id="shield-2">Shield: —</div>
        </div>
      </div>
      <strong id="status">Waiting for game state…</strong>
      <form id="prompt-form">
        <label for="prompt" id="prompt-label">Instructions for your bot</label>
        <textarea id="prompt" maxlength="4000" required disabled></textarea>
        <button id="submit" type="submit" disabled>Submit prompt</button>
      </form>
      <div id="notice" role="status"></div>
    </section>
  </div>
</main>
<dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
  <div class="help-header">
    <h2 id="help-title" data-i18n="helpTitle">Command reference</h2>
    <form method="dialog"><button type="submit" data-i18n="close">Close</button></form>
  </div>
  <p data-i18n="helpIntro"></p>
  <dl>
    <dt><code>C90</code></dt><dd data-i18n="helpClockwise"></dd>
    <dt><code>A45</code></dt><dd data-i18n="helpAnticlockwise"></dd>
    <dt><code>M</code></dt><dd data-i18n="helpMove"></dd>
    <dt><code>M0.2</code></dt><dd data-i18n="helpDistance"></dd>
    <dt><code>S1</code></dt><dd data-i18n="helpShieldOn"></dd>
    <dt><code>S0</code></dt><dd data-i18n="helpShieldOff"></dd>
    <dt><code>S</code></dt><dd data-i18n="helpShieldToggle"></dd>
    <dt><code>B</code></dt><dd data-i18n="helpFire"></dd>
  </dl>
  <p data-i18n="helpRules"></p>
  <p data-i18n="helpPrompt"></p>
</dialog>
<script src="/assets/translations.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
